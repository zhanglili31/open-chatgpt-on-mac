# /etc/nginx/conf.d/mac.example.com.conf
#
# 独立站点文件，不与 VPS 上已有的其他站点互相影响。
# certbot --nginx 会自动往这里插入 443 server 块和证书路径。

server {
    listen 80;
    listen [::]:80;
    server_name mac.example.com;

    # certbot 的 HTTP-01 校验走这里
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mac.example.com;

    # 下面两行由 certbot 自动填写，首次申请证书前可以先注释掉本 server 块
    ssl_certificate     /etc/letsencrypt/live/mac.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mac.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # write_file 可能传比较大的源码内容
    client_max_body_size 20m;

    access_log /var/log/nginx/cgm-access.log;
    error_log  /var/log/nginx/cgm-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8787;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization 头必须原样透传，否则后端认证永远失败
        proxy_set_header Authorization     $http_authorization;

        # 命令最长可以跑 15 分钟（MAX_TIMEOUT_MS=900000），
        # nginx 的读超时必须比它大，否则 npm install / 编译会在网关这层先被掐断。
        proxy_connect_timeout 15s;
        proxy_send_timeout    960s;
        proxy_read_timeout    960s;

        # MCP 的 Streamable HTTP 会用 SSE 长连接推事件，
        # 一旦开启缓冲，nginx 会攒着不发，客户端表现为「连上了但没反应」。
        proxy_buffering off;
        proxy_cache off;
        # SSE 要求连接不被升级/关闭
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }
}
